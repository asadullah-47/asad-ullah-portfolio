
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Something new is in the works. Check back soon for more from Asad Ullah.">

    <title>Coming Soon | Asad Ullah</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="coming-soon-body">

    <!-- Shared Header -->
    <div id="header-placeholder"></div>

    <main class="coming-soon-page">

        <!-- Decorative background -->
        <div class="cs-background-glow cs-glow-one"></div>
        <div class="cs-background-glow cs-glow-two"></div>

        <!-- Floating decorative shapes -->
        <span class="cs-floating-shape cs-shape-one" aria-hidden="true">✳</span>
        <span class="cs-floating-shape cs-shape-two" aria-hidden="true">✦</span>
        <span class="cs-floating-shape cs-shape-three" aria-hidden="true">+</span>
        <span class="cs-floating-shape cs-shape-four" aria-hidden="true">✧</span>

        <section class="cs-content">

            <!-- Animated illustration -->
            <div class="cs-visual" aria-hidden="true">

                <div class="cs-orbit cs-orbit-one"></div>
                <div class="cs-orbit cs-orbit-two"></div>

                <div class="cs-orb">
                    <div class="cs-orb-inner">
                        <span class="cs-orb-star">✦</span>
                        <span class="cs-orb-letter">AU</span>
                    </div>
                </div>

                <span class="cs-mini-star cs-mini-star-one">✦</span>
                <span class="cs-mini-star cs-mini-star-two">✧</span>
                <span class="cs-mini-dot cs-mini-dot-one"></span>
                <span class="cs-mini-dot cs-mini-dot-two"></span>

            </div>

            <!-- Status badge -->
            <div class="cs-status">
                <span class="cs-status-dot"></span>
                SOMETHING NEW IS IN THE WORKS
            </div>

            <!-- Main heading -->
            <h1 class="cs-title">
                Page Currently 
                <span>Updating.</span>
            </h1>

            <p class="cs-description">
               Currently updating this page. Please check back soon
            </p>

            <!-- Animated progress indicator -->
            <div class="cs-progress-area">
                <div class="cs-progress-label">
                    <span>Building something better</span>
                    <span class="cs-progress-icon">✦</span>
                </div>

                <div
                    class="cs-progress-track"
                    role="img"
                    aria-label="Decorative animated progress indicator"
                >
                    <div class="cs-progress-bar"></div>
                </div>
            </div>

            <!-- Buttons -->
            <div class="cs-actions">

                <a href="index.html" class="cs-button cs-button-primary">
                    <span aria-hidden="true">←</span>
                    Back to Home
                </a>

                <a href="contact.html" class="cs-button cs-button-secondary">
                    Let's Talk
                    <span aria-hidden="true">↗</span>
                </a>

            </div>

            <!-- Footer message -->
            <div class="cs-bottom-note">
                <span class="cs-note-line"></span>
                <p>Designed with purpose. Built with passion.</p>
                <span class="cs-note-line"></span>
            </div>

        </section>

    </main>

    <!-- Shared Footer -->
    <div id="footer-placeholder"></div>

    <script src="js/main.js"></script>

</body>
</html>
